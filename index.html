<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
  <title>Tableros de Monitoreo</title>

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <link href="css/estilos.css" rel="stylesheet"/>

  <meta content="Repositorio de tableros de monitoreo y seguimiento de la Oficina de Monitoreo del MVCS." name="description"/>
  <meta content="#C00000" name="theme-color"/>

  <link href="manifest.webmanifest" rel="manifest"/>
  <link href="favicon.ico" rel="icon" sizes="any"/>
  <link href="img/icons/favicon-32.png" rel="icon" sizes="32x32" type="image/png"/>
  <link href="img/icons/favicon-16.png" rel="icon" sizes="16x16" type="image/png"/>
  <link href="img/icons/apple-touch-icon.png" rel="apple-touch-icon"/>

  <meta content="yes" name="apple-mobile-web-app-capable"/>
  <meta content="yes" name="mobile-web-app-capable"/>
  <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/>
  <meta content="Tableros MVCS" name="apple-mobile-web-app-title"/>
  <meta content="Tableros MVCS" name="application-name"/>

  <!-- NUEVA VERSION PARA EVITAR CACHE ANTIGUA -->
  <script defer="True" src="js/a9.js?v=20261028-2"></script>
  <script defer="" src="js/pwa.js"></script>
</head>

<body class="bg-gray-100 min-h-screen">

  <div class="background-container"></div>

  <header>
    <div class="h-2.5 w-full flex">
      <div class="flex-1 barra-azul"></div>
      <div class="flex-1 barra-verde"></div>
      <div class="flex-1 barra-amarilla"></div>
      <div class="flex-1 barra-rosada"></div>
      <div class="flex-1 barra-celeste"></div>
      <div class="flex-1 barra-roja"></div>
    </div>

    <div class="py-6 mt-3 text-center text-white relative max-w-7xl mx-auto px-4">
      <img
        alt="Logo"
        class="hidden sm:block h-10 sm:h-12 absolute left-2 sm:left-4 top-[40%] transform -translate-y-1/2"
        src="img/logo MVCS.png"
      />

      <h1 class="text-xl sm:text-3xl md:text-4xl lg:text-5xl font-bold tracking-wide text-black">
        OFICINA DE MONITOREO
      </h1>

      <div class="mt-2 inline-block bg-red-600 px-2 sm:px-4 py-1 transform -skew-x-12">
        <span class="inline-block skew-x-12 text-white font-semibold text-base sm:text-lg md:text-2xl lg:text-3xl">
          REPOSITORIO DE TABLEROS DE MONITOREO Y SEGUIMIENTO
        </span>
      </div>
    </div>
  </header>

  <main class="flex items-center justify-center p-6 mt-6">
    <div
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 max-w-7xl w-full"
      id="x9">
    </div>
  </main>

  <div class="pwa-sheet" hidden="" id="pwa-install">
    <div class="pwa-backdrop" data-pwa-close=""></div>

    <div
      aria-describedby="pwa-desc"
      aria-labelledby="pwa-title"
      aria-modal="true"
      class="pwa-card"
      role="dialog">

      <div class="pwa-stripe">
        <div class="barra-azul"></div>
        <div class="barra-verde"></div>
        <div class="barra-amarilla"></div>
        <div class="barra-rosada"></div>
        <div class="barra-celeste"></div>
        <div class="barra-roja"></div>
      </div>

      <button
        aria-label="Cerrar"
        class="pwa-x"
        data-pwa-close=""
        type="button">×</button>

      <div class="pwa-head">
        <img alt="" class="pwa-icon" src="img/icons/icon-192.png"/>

        <div>
          <div class="pwa-title" id="pwa-title">
            Guardar en tu dispositivo
          </div>
          <div class="pwa-sub">
            Tableros de Monitoreo · MVCS
          </div>
        </div>
      </div>

      <p class="pwa-desc" id="pwa-desc">
        Instálala como aplicación y abre los tableros desde tu pantalla de inicio,
        a pantalla completa y con un solo toque.
      </p>

      <div class="pwa-actions" data-pwa-mode="prompt">
        <button
          class="pwa-btn pwa-btn-primary"
          id="pwa-install-btn"
          type="button">Instalar</button>

        <button
          class="pwa-btn pwa-btn-ghost"
          data-pwa-close=""
          type="button">Ahora no</button>
      </div>

      <div class="pwa-actions" data-pwa-mode="ios" hidden="">
        <button
          class="pwa-btn pwa-btn-primary"
          id="pwa-install-ios"
          type="button">Instalar</button>

        <button
          class="pwa-btn pwa-btn-ghost"
          data-pwa-close=""
          type="button">Ahora no</button>
      </div>

      <div class="pwa-actions" data-pwa-mode="ios-final" hidden="">
        <p class="pwa-final">
          Toca
          <span aria-hidden="true" class="pwa-share">
            <svg
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24">
              <path d="M12 16V4"></path>
              <path d="M8 8l4-4 4 4"></path>
              <path d="M20 14v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-5"></path>
            </svg>
          </span>
          aquí abajo y elige <b>Añadir a pantalla de inicio</b>.
        </p>

        <div aria-hidden="true" class="pwa-flecha">
          <svg
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            viewBox="0 0 24 24">
            <path d="M12 5v14"></path>
            <path d="M6 13l6 6 6-6"></path>
          </svg>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
